<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện Bài tập Toán Tiểu học</title>
<style>
:root{--ink:#2d3142;--soft:#5a5f75;--accent:#e8523f;--tint:#ffe9e6}
*{box-sizing:border-box}
body{margin:0;font-family:"Baloo 2","Quicksand","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:40px;
background:radial-gradient(circle at 10% 6%,#fff6da 0,transparent 45%),radial-gradient(circle at 92% 3%,#ffe1e1 0,transparent 40%),linear-gradient(180deg,#eaf6ff,#f5fbff 60%,#fdf9ef)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hero{text-align:center;padding:36px 0 10px}
.badge{display:inline-block;background:#fff;border:2px dashed #ffab00;color:#e8523f;font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px;margin-bottom:10px;letter-spacing:.5px}
h1{font-size:clamp(27px,7vw,40px);margin:0 0 6px;line-height:1.15}h1 span{color:var(--accent)}
.sub{color:var(--soft);font-weight:600;font-size:15px;max-width:480px;margin:0 auto}
h2{font-size:19px;margin:26px 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
a.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(45,49,66,.10);border:2px solid transparent;min-height:68px}
a.item:active{transform:scale(.98)}a.item:hover{border-color:var(--accent)}
.chip{flex:none;width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px}
.txt{flex:1;min-width:0}.txt b{display:block;font-size:17px;line-height:1.3}.txt small{color:var(--soft);font-weight:600;font-size:13px}
.go{color:var(--accent);font-weight:800;font-size:20px}
.empty{background:#fff;border:2px dashed #cfd8e6;border-radius:16px;padding:22px;text-align:center;color:var(--soft);font-weight:600}
.back{display:inline-block;margin-top:16px;color:var(--soft);font-weight:700;text-decoration:none;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
a.tile{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff;border-radius:20px;padding:22px 10px;text-decoration:none;color:var(--ink);box-shadow:0 8px 22px rgba(45,49,66,.12);border-bottom:6px solid var(--c)}
a.tile:active{transform:scale(.97)}a.tile .e{font-size:38px;line-height:1}a.tile b{font-size:26px;color:var(--c)}a.tile small{color:var(--soft);font-weight:600;font-size:13px}
footer{text-align:center;color:var(--soft);font-size:12.5px;margin-top:30px;font-weight:600}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><span class="badge">THƯ VIỆN BÀI TẬP</span><h1>Bài tập <span>Toán</span> Tiểu học</h1><p class="sub">Con chọn đúng lớp của mình để bắt đầu làm bài nhé. Mỗi bài đều được chấm điểm tự động ngay khi nộp.</p></div>
<div class="tiles">
<a class="tile" style="--c:#3fb083" href="https://toantieuhoccothanhmai.github.io/lop2/"><span class="e">🌱</span><b>Lớp 2</b><small>Sắp cập nhật</small></a>
<a class="tile" style="--c:#2f7fe0" href="https://toantieuhoccothanhmai.github.io/lop3/"><span class="e">🚀</span><b>Lớp 3</b><small>Sắp cập nhật</small></a>
<a class="tile" style="--c:#8675a9" href="https://toantieuhoccothanhmai.github.io/lop4/"><span class="e">🧩</span><b>Lớp 4</b><small>3 bài</small></a>
<a class="tile" style="--c:#e8523f" href="https://toantieuhoccothanhmai.github.io/lop5/"><span class="e">🏆</span><b>Lớp 5</b><small>Sắp cập nhật</small></a>
</div>
<footer>Thư viện bài tập của cô · Cập nhật thường xuyên 🌈</footer>
</div>
</body>
</html>
